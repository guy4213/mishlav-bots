# From real calls: study-day leads also ask about the long payroll course.
id: R3
name: Asks about the long course
core: false
description: >
  The customer asks about the payroll accountant course (price, Friday track, discount). That is out of
  the bot's scope: it gives no course prices, tracks or discounts and hands off with other.
context:
  first_name: "מירב"
  interested_day_id: payroll-2026-12-08-zoom
actor_script:
  - "האמת שאני חושבת בכלל על הקורס של חשבי שכר. כמה הוא עולה?"
  - "יש מסלול בימי שישי? ויש הנחה?"
expect:
  outcome: HUMAN_FOLLOWUP
  required_tools:
    - tool: request_human
      params:
        reason: { equals: other }
  forbidden_tools: [send_purchase_link]
  manual_checks:
    - "Gave no course price, track or discount"
guide_he:
  title: שאלה על הקורס הארוך
  expect: הבוט אומר שהוא מטפל רק בימי העיון, לא מוסר מחיר / מסלולים / הנחה של הקורס, ומעביר לנציג (other).
  tips:
    - שאל כמה עולה קורס חשבי שכר.
    - שאל אם יש מסלול בשישי ואם יש הנחה.
  watch:
    - לא מסר מחיר, מסלול או הנחה של הקורס
simulate:
  - { tool: request_human, params: { reason: other } }
  - { tool: end_call, params: { reason: completed } }
