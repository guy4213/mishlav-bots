# From real calls: a Zoom study day is one study day in two meetings; customers quote prices they remember.
id: R7
name: Zoom pair - remembered price
core: false
description: >
  The customer asks for the dates and says "it's 360 for both days, right?". The bot gives both dates
  of the two Zoom meetings and the price only from get_day_info (does not confirm 360), then sends the link.
context:
  first_name: "מיכל"
  interested_day_id: 2027-02-21-zoom
actor_script:
  - "כן, מתי זה בדיוק?"
  - "וזה שלוש מאות שישים לשני הימים, נכון?"
  - "בסדר, תשלחי לי קישור."
expect:
  outcome: LINK_SENT
  required_tools:
    - tool: get_day_info
      params:
        day_id: { equals: 2027-02-21-zoom }
    - tool: send_purchase_link
      params:
        day_id: { equals: 2027-02-21-zoom }
  forbidden_tools: [request_human]
  manual_checks:
    - "Said both meeting dates and that registration covers the whole study day (never \"two days\")"
    - "Quoted the price from the tool and did not confirm 360"
guide_he:
  title: יום עיון בזום בשני מפגשים – "360 לשני הימים?"
  expect: הבוט אומר את שני תאריכי המפגשים (יום עיון אחד בשני מפגשים, לא "יומיים") ואת המחיר מהכלי בלבד – לא מאשר 360 – ושולח קישור.
  tips:
    - שאל מתי זה.
    - תגיד "זה 360 לשני הימים, נכון?".
    - בקש קישור.
  watch:
    - אמר את שני התאריכים ושההרשמה ליום העיון כולו (לא "יומיים")
    - מסר את המחיר מהכלי ולא אישר 360
simulate:
  - { tool: get_day_info, params: { day_id: 2027-02-21-zoom } }
  - { tool: send_purchase_link, params: { day_id: 2027-02-21-zoom } }
  - { tool: end_call, params: { reason: completed } }
