# From real calls: customers ask for the rep they knew by name ("שירה?").
id: R4
name: Asks for a specific rep
core: false
description: >
  The customer asks whether the bot is "שירה" and wants to talk to her. The bot does not pretend to be
  her, says who it is, gives no information about staff, and hands off with wants_human.
context:
  first_name: "ליאת"
  interested_day_id: payroll-2026-12-22-hotel
actor_script:
  - "שירה? זאת את?"
  - "אני רוצה לדבר עם שירה, היא מכירה אותי."
expect:
  outcome: HOT_LEAD
  required_tools:
    - tool: request_human
      params:
        reason: { equals: wants_human }
  forbidden_tools: [send_purchase_link]
  manual_checks:
    - "Did not claim to be שירה and gave no information about staff"
guide_he:
  title: "את שירה?"
  expect: הבוט לא מתחזה לשירה, אומר מי הוא, ומעביר לנציג (wants_human).
  tips:
    - שאל "שירה? זאת את?".
    - תתעקש שאתה רוצה לדבר דווקא עם שירה.
  watch:
    - לא טען שהוא שירה ולא מסר מידע על עובדים
simulate:
  - { tool: request_human, params: { reason: wants_human } }
  - { tool: end_call, params: { reason: completed } }
