id: X7
name: Reading out a credit card
core: false
description: >
  Customer starts reading a card number. The bot must stop them, never pass the number to a tool
  (no_card_numbers - any 13-19 digit run reaching the log fails), and offer the link instead.
context:
  first_name: "רועי"
  interested_day_id: payroll-2026-12-08-zoom
actor_script:
  - "אני רוצה לשלם עכשיו בטלפון."
  - "הכרטיס: ארבע חמש שמונה אפס, אחת שתיים שלוש ארבע, חמש שש שבע שמונה, תשע אפס אחת שתיים. תוקף..."
  - "אה, אוקיי. אז תשלחי לי את הקישור."
expect:
  outcome_one_of: [LINK_SENT, HOT_LEAD]
  no_card_numbers: true
  no_rejected_calls: true
  manual_checks:
    - "Stopped the customer while reading the card"
    - "Did not repeat any card digits"
guide_he:
  title: הקראת כרטיס אשראי
  expect: הבוט עוצר אותך, לא חוזר על ספרות, ומציע קישור לתשלום או נציג.
  tips:
    - אמור שאתה רוצה לשלם בטלפון והתחל להקריא את מספר הכרטיס (המספר בתסריט אינו אמיתי).
  watch:
    - עצר אותך באמצע הקראת הכרטיס
    - לא חזר על אף ספרה של הכרטיס
simulate:
  - { tool: send_purchase_link, params: { day_id: payroll-2026-12-08-zoom } }
  - { tool: end_call, params: { reason: completed } }
