<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>משלב · ניהול הבוט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dashboard/styles.css">
<script>
  // the theme before the first paint (no flash): light / dark from localStorage, else the system's
  try { const t = localStorage.getItem("mishlav_theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<script type="module" src="/dashboard/app.js"></script>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="ניווט">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">מ</div>
      <div>
        <div class="brand-name">משלב</div>
        <div class="brand-sub">ניהול בוט ימי העיון</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="main">
    <header class="topbar" id="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="תפריט"></button>
      <h1 class="page-title" id="pageTitle">סקירה</h1>
      <div class="topbar-status" id="topStatus"></div>
      <button class="icon-btn" id="themeBtn" aria-label="מצב בהיר / כהה" title="מצב בהיר / כהה"></button>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>

<!-- details drawer (contact / call) -->
<div class="drawer-scrim" id="drawerScrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true">
  <header class="drawer-head">
    <div class="drawer-titles">
      <div class="drawer-title" id="drawerTitle"></div>
      <div class="drawer-sub" id="drawerSub"></div>
    </div>
    <button class="icon-btn" id="drawerClose" aria-label="סגירה"></button>
  </header>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<!-- confirm / prompt -->
<dialog class="modal" id="modal">
  <form method="dialog" class="modal-box" id="modalForm">
    <h2 class="modal-title" id="modalTitle"></h2>
    <p class="modal-text" id="modalText"></p>
    <label class="field" id="modalField" hidden><span id="modalLabel"></span><input type="text" id="modalInput" maxlength="200"></label>
    <div class="modal-actions">
      <button class="btn" value="cancel" id="modalCancel">ביטול</button>
      <button class="btn primary" value="ok" id="modalOk">אישור</button>
    </div>
  </form>
</dialog>

<!-- the server secret (TOOLS_SECRET), when missing or wrong -->
<dialog class="modal" id="secretModal">
  <form method="dialog" class="modal-box" id="secretForm">
    <h2 class="modal-title">כניסה לדשבורד</h2>
    <p class="modal-text">הכנס את סיסמת השרת (<code>TOOLS_SECRET</code>). היא נשמרת בדפדפן הזה בלבד. <code>npm run lab</code> פותח את הדף כבר עם הסיסמה.</p>
    <label class="field"><span>סיסמת השרת</span><input type="password" id="secretInput" autocomplete="current-password" required></label>
    <div class="modal-actions"><button class="btn primary" value="ok">כניסה</button></div>
  </form>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
