<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>משלב · ניהול הבוט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dashboard/styles.css">
<script>
  // the theme before the first paint (no flash): light / dark from localStorage, else the system's
  try { const t = localStorage.getItem("mishlav_theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<script type="module" src="/dashboard/app.js"></script>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="ניווט">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">מ</div>
      <div>
        <div class="brand-name">משלב</div>
        <div class="brand-sub">ניהול בוט ימי העיון</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="user-box" id="userBox" hidden></div>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="main">
    <div class="view-as-bar" id="viewAsBar" hidden>
      <span>אתה רואה את הדשבורד בדיוק כמו משתמש של משלב</span>
      <button class="btn sm" id="viewAsExit">חזרה לאדמין</button>
    </div>
    <header class="topbar" id="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="תפריט"></button>
      <h1 class="page-title" id="pageTitle">סקירה</h1>
      <div class="topbar-status" id="topStatus"></div>
      <button class="icon-btn" id="themeBtn" aria-label="מצב בהיר / כהה" title="מצב בהיר / כהה"></button>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>

<!-- details drawer (contact / call) -->
<div class="drawer-scrim" id="drawerScrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true">
  <header class="drawer-head">
    <div class="drawer-titles">
      <div class="drawer-title" id="drawerTitle"></div>
      <div class="drawer-sub" id="drawerSub"></div>
    </div>
    <button class="icon-btn" id="drawerClose" aria-label="סגירה"></button>
  </header>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<!-- confirm / prompt -->
<dialog class="modal" id="modal">
  <form method="dialog" class="modal-box" id="modalForm">
    <h2 class="modal-title" id="modalTitle"></h2>
    <p class="modal-text" id="modalText"></p>
    <label class="field" id="modalField" hidden><span id="modalLabel"></span><input type="text" id="modalInput" maxlength="200"></label>
    <div class="modal-actions">
      <button class="btn" value="cancel" id="modalCancel">ביטול</button>
      <button class="btn primary" value="ok" id="modalOk">אישור</button>
    </div>
  </form>
</dialog>

<!-- logging in: a phone + a password; or the server secret (TOOLS_SECRET, the project team) -->
<dialog class="modal" id="loginModal">
  <form class="modal-box" id="loginForm" novalidate>
    <div class="login-brand"><div class="brand-mark" aria-hidden="true">מ</div><h2 class="modal-title">כניסה לדשבורד משלב</h2></div>
    <label class="field"><span>מספר טלפון</span><input type="tel" id="loginPhone" class="ltr" inputmode="tel" autocomplete="username" placeholder="0501234567"></label>
    <label class="field"><span>סיסמה</span><input type="password" id="loginPassword" autocomplete="current-password"></label>
    <p class="small login-error" id="loginError" hidden></p>
    <div class="modal-actions"><button class="btn primary" type="submit" id="loginBtn">כניסה</button></div>
    <details class="small muted login-secret">
      <summary>כניסה עם סיסמת השרת</summary>
      <label class="field"><span>סיסמת השרת (<code>TOOLS_SECRET</code>)</span><input type="password" id="secretInput" autocomplete="off"></label>
      <button class="btn" type="button" id="secretBtn">כניסה עם סיסמת השרת</button>
    </details>
  </form>
</dialog>

<!-- the logged-in user's own password -->
<dialog class="modal" id="pwModal">
  <form class="modal-box" id="pwForm" novalidate>
    <h2 class="modal-title">החלפת סיסמה</h2>
    <label class="field"><span>הסיסמה הנוכחית</span><input type="password" id="pwCurrent" autocomplete="current-password"></label>
    <label class="field"><span>סיסמה חדשה (8 תווים לפחות)</span><input type="password" id="pwNew" autocomplete="new-password"></label>
    <p class="small login-error" id="pwError" hidden></p>
    <div class="modal-actions"><button class="btn" type="button" id="pwCancel">ביטול</button><button class="btn primary" type="submit">שמירה</button></div>
  </form>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
