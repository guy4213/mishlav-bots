# Mishlav study-day bot — settings.
# Defaults per spec 4.7 are FOR TESTS; to be presented to Mishlav for approval once the system works.

business_hours:
  timezone: Asia/Jerusalem          # DST handled automatically
  days: [sun, mon, tue, wed, thu]   # no Friday / Saturday
  open: "09:00"
  close: "17:00"                    # exclusive
  # Full non-working days (statutory holidays). Verified against the Hebrew calendar (5787/5788);
  # apps/backend/test/settings.test.ts fails if a date is wrong or a weekday holiday is missing.
  # No statutory holidays fall between Nov 2026 and Pesach 2027. Add 2028 by Aug 2027 (the test enforces it).
  holidays:
    - "2027-04-22"   # Thu 15 Nisan     Pesach, first day
    - "2027-04-28"   # Wed 21 Nisan     Pesach, seventh day
    - "2027-05-12"   # Wed 5 Iyar       Yom HaAtzmaut (no shift this year)
    - "2027-06-11"   # Fri 6 Sivan      Shavuot (Friday anyway)
    - "2027-10-02"   # Sat 1 Tishri     Rosh Hashana I (Saturday anyway)
    - "2027-10-03"   # Sun 2 Tishri     Rosh Hashana II
    - "2027-10-11"   # Mon 10 Tishri    Yom Kippur
    - "2027-10-16"   # Sat 15 Tishri    Sukkot (Saturday anyway)
    - "2027-10-23"   # Sat 22 Tishri    Shemini Atzeret / Simchat Torah (Saturday anyway)
  # Holiday eves — close early. The 13:00 close time is a test default; TODO(mishlav): confirm,
  # and whether to call at all on Chol HaMoed (Apr 23–27, Oct 17–21 2027 — open for now).
  half_days:
    - { date: "2027-04-21", close: "13:00" }   # Wed  Erev Pesach
    - { date: "2027-04-27", close: "13:00" }   # Tue  Erev Shvi'i shel Pesach
    - { date: "2027-06-10", close: "13:00" }   # Thu  Erev Shavuot
    - { date: "2027-10-01", close: "13:00" }   # Fri  Erev Rosh Hashana (Friday anyway)
    - { date: "2027-10-10", close: "13:00" }   # Sun  Erev Yom Kippur
    - { date: "2027-10-15", close: "13:00" }   # Fri  Erev Sukkot (Friday anyway)
    - { date: "2027-10-22", close: "13:00" }   # Fri  Erev Shemini Atzeret (Friday anyway)

callback:
  min_lead_minutes: 5      # a callback must be at least this far in the future ("in 10 minutes" is common)
  max_days_ahead: 60       # beyond this the tool refuses (too_far)

# Retries (packages/shared/src/retry.ts) and the automatic dialer (apps/backend/src/dialer.ts).
# The dialer's on/off switch is in the database (dialer_control), not here: the dashboard starts and stops it.
dialing:
  # Calls with no result (no answer, voicemail, hung up before a result). PROPOSAL, pending Mishlav's approval.
  # The streak counts no-result calls in a row; it restarts when the customer answers (or a wrong number moves
  # to the next phone). On stop: never answered -> closed ("לא ענה"); answered once -> a rep (unreachable).
  no_answer_streak_max: 4         # this many no-result calls in a row -> stop
  max_total_calls: 8              # all calls of a contact, callbacks included -> stop after the last one
  midday: "13:00"                 # morning = open..midday, afternoon = midday..close
  no_answer_retry:                # the next call after the 1st, 2nd, 3rd no-result call in a row
    - { after_hours: 5 }          # same day, at least 5 h later; outside hours -> the next opening
    - { business_days: 1 }        # next business day, at the start of the other half of the day
    - { business_days: 2 }        # two business days later, the other half again
  follow_up_days: 3               # rep follow-up after LINK_SENT
  max_concurrent_calls: 20        # not used yet: the phone line holds one call at a time, so the dialer does too
  wrong_number_next_phone: true   # WRONG_NUMBER -> phone 2, then phone 3, else close
  ring_timeout_s: 40              # no answer by then -> cancel; ends like any no-answer (manual and dialer calls)
  pause_between_calls_s: 5        # the dialer waits this long after a call before the next one
  tick_s: 10                      # how often the dialer looks for work (on/off, hours, line, queue)

# The purchase link the bot sends (send_purchase_link). {day} = the study day in Hebrew, {url} = its purchase_url
# (config/knowledge/days/*.md). TODO(mishlav): the final wording and the sender name.
sms:
  link_template: "משלב: קישור לרכישת {day}: {url}"
  # TEMPORARY, tests only: sent instead of link_template. Zadarma refuses links in SMS to Israel ("Links in SMS to
  # this direction are prohibited"), and a commercial-looking text (the day, a date, "purchase") that matches no
  # template approved in the account ("SMS text does not match any template"); a short neutral text goes through.
  # DELETE this line once Mishlav's SMS provider is connected.
  test_without_link: "משלב: תודה על השיחה, הפרטים יישלחו אליך בהמשך."

# Field/outcome mapping: how tool calls translate into outcomes (model proposes, backend decides).
outcome_mapping:
  request_human:
    wants_human: HOT_LEAD
    pay_via_rep: HOT_LEAD
    discount_request: HOT_LEAD
    course_interest: HOT_LEAD   # another course (the long payroll course): a lead for the rep
    company_purchase: COMPANY
    other: HUMAN_FOLLOWUP
  end_call:
    completed: null            # not decisive on its own
    not_interested: NOT_INTERESTED
    do_not_call: DO_NOT_CALL
    voicemail: VOICEMAIL
    already_registered: ALREADY_REGISTERED
    wrong_number: WRONG_NUMBER

testing:
  # TEST ONLY: lets request_human carry a dictated name/phone. Off: the phone is on file, the bot never asks
  # for a number (Guy, Nov 2026). Spec 4.2 forbids a phone parameter in production anyway.
  capture_dictated_details: false
  log_dir: logs
  scoring:                       # pass criteria, spec 3.5
    max_avg_latency_ms: 1200
    max_latency_ms: 2000
    min_voice_score: 4
    provider_priority: [C, A, B] # C (Gemini Live) first by team decision; PDF had A, C, B
    cost_close_pct: 15           # flag when a lower-priority passer is this much cheaper per minute

# Gold Excel (Part 4): the student export's header -> the `contacts` column in Supabase (supabase/migrations).
# `contacts` is an exact copy of the export; Gold pulls the bot's changes back under the same headers
# (GET /api/gold/changes). Built from the real export's format; sample: apps/backend/fixtures/gold-sample.xlsx.
gold_import:
  sheet: תלמידים
  record_id_key: מזהה         # the first column has no header: the record id's key in what Gold pulls
  columns:
    "": gold_record_id        # the first column: Gold's record id (20 characters)
    ת.ז: national_id
    חברה: company
    שם מלא: full_name         # the bot calls the customer by its first word
    אימייל: email
    טלפון: phone
    טלפון 2: phone2
    טלפון 3: phone3
    הערות: notes              # often a Google link; the bot appends its "[הערת הבוט] ..." lines
    עיר: city                 # "Empty" means empty
    כתובת: address
    כתובת 2: address2
    מחלקה: department
    קורס מבוקש: requested_course   # trim: some end with a space
    מקור: source
    סטטוס: status             # the bot sets it (gold_status_text in supabase/migrations)

# What a call's Gemini tokens cost: USD per 1M tokens (Gemini 3.1 Flash Live, paid tier, as published Nov 2026).
# The Live API bills every turn on the whole session context, so a call costs more than its minutes x the audio rate.
# Check https://ai.google.dev/gemini-api/docs/pricing when the model or the prices change.
pricing:
  gemini_live:
    input:  { TEXT: 0.75, AUDIO: 3.00, IMAGE: 1.00, VIDEO: 1.00 }
    output: { TEXT: 4.50, AUDIO: 12.00 }
