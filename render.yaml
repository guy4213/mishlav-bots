# Render: one web service = the tools server + the dashboard + the Zadarma phone line.
# New service: Render -> New -> Blueprint -> this repo. Existing service: copy these settings into it
# (Settings: Build Command, Start Command, Health Check Path; Environment: the variables below).
# Secrets (sync: false) are typed in Render's dashboard, never committed.
services:
  - type: web
    name: mishlav-bots
    runtime: node
    # free sleeps after 15 idle minutes: the line unregisters and incoming calls are lost until the next
    # visit wakes it (dialing out from the dashboard still works). starter = always on.
    plan: free
    # tsx (runs the TypeScript) is a dev dependency: install it too
    buildCommand: npm ci --include=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: TOOLS_SECRET # the dashboard password too (>= 16 chars)
        sync: false
      - key: GOOGLE_API_KEY # Gemini Live (the bot's voice on the phone line)
        sync: false
      - key: ZADARMA_SIP_SERVER
        value: pbx.zadarma.com
      - key: ZADARMA_SIP_LOGIN # e.g. 660895-100 (my.zadarma.com -> My PBX -> Extension numbers)
        sync: false
      - key: ZADARMA_SIP_PASSWORD
        sync: false
      - key: ZADARMA_NUMBER # display only
        value: "+972555172508"
      # Supabase: the contacts the bot calls and updates (project mishlav-bots)
      - key: SUPABASE_URL
        value: https://otimdvfajyywwkkwccyz.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY # Supabase -> Project Settings -> API keys -> service_role / secret
        sync: false
      # Gold pulls the bot's changes daily: GET /api/gold/changes?since=... with header X-Api-Key (unset: refused)
      - key: GOLD_API_KEY
        sync: false
      # The automatic dialer: optional, dial only these numbers (comma-separated); leave unset in production
      - key: DIALER_ONLY_NUMBERS
        sync: false
      # The purchase-link SMS through Zadarma's API (unset: log only, nothing is sent)
      - key: ZADARMA_API_KEY
        sync: false
      - key: ZADARMA_API_SECRET
        sync: false
      - key: ZADARMA_SMS_SENDER # optional: a sender registered with Zadarma
        sync: false
      # Optional: PHONE_GEMINI_MODEL, PHONE_VOICE, OPEN_AFTER_SILENCE_S, BOT_NAME,
      # LIVEKIT_URL / LIVEKIT_API_KEY / LIVEKIT_API_SECRET (browser calls), elevenLabsAgentsKey.
